<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>ProCash में लॉग इन करें</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="stage">
  <div class="card" id="card">

    <section class="face" id="loginFace" aria-labelledby="lTitle">
      <h1 id="lTitle">ProCash में लॉग इन करें</h1>
      <p class="sub">आपका हिसाब वहीं मिलेगा, जहां छोड़ा था।</p>
      <button type="button" class="gbtn"><b aria-hidden="true">G</b> Google से जारी रखें</button>
      <p class="or"><span>या ईमेल से</span></p>
      <form id="loginForm" novalidate>
        <div class="field">
          <input id="lEmail" type="email" placeholder=" " autocomplete="email" inputmode="email" data-rule="email">
          <label for="lEmail">ईमेल</label>
          <small class="err"></small>
        </div>
        <div class="field">
          <input id="lPass" type="password" placeholder=" " autocomplete="current-password" data-rule="loginPass">
          <label for="lPass">पासवर्ड</label>
          <button type="button" class="eye" data-for="lPass" aria-pressed="false">दिखाएं</button>
          <small class="err"></small>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="remember" checked> मुझे याद रखें</label>
          <button type="button" class="link" id="forgot">पासवर्ड भूल गए?</button>
        </div>
        <p class="alert" role="alert"></p>
        <div class="run-zone">
          <button type="submit" class="go" aria-disabled="true"><span>लॉग इन</span></button>
          <p class="hint" aria-live="polite"></p>
        </div>
      </form>
      <p class="switch">नए हैं? <button type="button" class="link" data-flip="signup">खाता बनाएं</button></p>
      <p class="switch"><button type="button" class="link skip">अभी छोड़ें, बाद में लॉग इन करूंगा</button></p>
    </section>

    <section class="face back" id="signupFace" aria-labelledby="sTitle" inert>
      <h1 id="sTitle">खाता बनाएं</h1>
      <p class="sub">नाम, ईमेल और पासवर्ड, बस इतना ही।</p>
      <button type="button" class="gbtn"><b aria-hidden="true">G</b> Google से जारी रखें</button>
      <p class="or"><span>या ईमेल से</span></p>
      <form id="signupForm" novalidate>
        <div class="field">
          <input id="sName" type="text" placeholder=" " autocomplete="name" data-rule="name">
          <label for="sName">आपका नाम</label>
          <small class="err"></small>
        </div>
        <div class="field">
          <input id="sEmail" type="email" placeholder=" " autocomplete="email" inputmode="email" data-rule="email">
          <label for="sEmail">ईमेल</label>
          <small class="err"></small>
        </div>
        <div class="field">
          <input id="sPass" type="password" placeholder=" " autocomplete="new-password" data-rule="newPass">
          <label for="sPass">पासवर्ड (8+ अक्षर, एक अंक)</label>
          <button type="button" class="eye" data-for="sPass" aria-pressed="false">दिखाएं</button>
          <small class="err"></small>
        </div>
        <div class="field">
          <input id="sPass2" type="password" placeholder=" " autocomplete="new-password" data-rule="match" data-match="#sPass">
          <label for="sPass2">पासवर्ड दोबारा लिखें</label>
          <small class="err"></small>
        </div>
        <p class="alert" role="alert"></p>
        <div class="run-zone">
          <button type="submit" class="go" aria-disabled="true"><span>खाता बनाएं</span></button>
          <p class="hint" aria-live="polite"></p>
        </div>
      </form>
      <p class="switch">पहले से खाता है? <button type="button" class="link" data-flip="login">लॉग इन करें</button></p>
      <p class="switch"><button type="button" class="link skip">अभी छोड़ें, बाद में लॉग इन करूंगा</button></p>
    </section>

  </div>
</main>
<script type="module" src="auth-ui.js"></script>
</body>
</html>
